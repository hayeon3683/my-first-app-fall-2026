{% extends "layout.html" %}
{% set active_page = "hello" %}
{% block title %}Hello{% endblock %}
{% block content %}
<section class="surface narrow">
    <h1>{{ message }}</h1>
    <form action="{{ url_for('home_routes.hello_world') }}" method="get">
        <label class="form-label fw-semibold" for="name">Your name</label>
        <input class="form-control mb-3" id="name" name="name" required>
        <button class="btn btn-primary" type="submit">Say hello</button>
    </form>
</section>
{% endblock %}
