{% extends "layout.html" %}
{% set active_page = "rps" %}
{% block title %}Rock Paper Scissors{% endblock %}
{% block content %}
<section class="surface narrow">
    <i class="bi bi-controller feature-icon mb-3" aria-hidden="true"></i>
    <h1>Rock Paper Scissors</h1>
    <p>Play a round against the computer.</p>
    <form action="{{ url_for('rps_routes.results') }}" method="post">
        <label class="form-label fw-semibold" for="user_choice">Choose your move</label>
        <select class="form-select mb-3" id="user_choice" name="user_choice" required>
            <option value="" selected disabled>Select a move</option>
            <option value="rock">Rock</option>
            <option value="paper">Paper</option>
            <option value="scissors">Scissors</option>
        </select>
        <button class="btn btn-primary" type="submit">Play round</button>
    </form>
</section>
{% endblock %}
