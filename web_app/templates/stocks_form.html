{% extends "layout.html" %}
{% set active_page = "stocks" %}
{% block title %}Stocks{% endblock %}
{% block content %}
<section class="surface narrow">
    <i class="bi bi-graph-up feature-icon mb-3" aria-hidden="true"></i>
    <h1>Look up a stock</h1>
    <p>Enter a ticker to see its daily adjusted closing prices.</p>
    <form action="{{ url_for('stocks_routes.stocks_dashboard') }}" method="post">
        <label class="form-label fw-semibold" for="symbol">Ticker symbol</label>
        <input class="form-control mb-3" id="symbol" name="symbol" placeholder="e.g., MSFT" maxlength="20" required>
        <button class="btn btn-primary" type="submit">View dashboard</button>
    </form>
</section>
{% endblock %}
